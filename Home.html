<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <title>My Website Banner Page</title>
  <meta name="description" content="This is a banner page with a redirect link to another website. Includes all important meta tags.">
  <meta name="keywords" content="redirect, banner, html, website, link">
  <meta name="author" content="Your Name">
  <meta name="robots" content="index, follow">

  <!-- Open Graph Meta (for Facebook, LinkedIn etc.) -->
  <meta property="og:title" content="Mandira hawladar">
  <meta property="og:description" content="18+ video leke .">
  <meta property="og:image" content="IMG_20250729_005733_653.jpg"> <!-- Optional -->
  <meta property="og:url" content="https://win1000.netlify.app/">
  <meta property="og:type" content="website">

  <!-- Twitter Card Meta -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Website Banner Page">
  <meta name="twitter:description" content="This banner page redirects instantly to another site.">
  <meta name="twitter:image" content="https://yourdomain.com/preview-image.jpg"> <!-- Optional -->

  <!-- Redirect -->
  <meta http-equiv="refresh" content="0;url=https://example.com"> <!-- Change URL -->

  <!-- Favicon (Optional) -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Page Style -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      text-align: center;
      margin-top: 100px;
    }

    .banner {
      background-color: #007BFF;
      color: white;
      padding: 20px 40px;
      border-radius: 12px;
      font-size: 24px;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .banner:hover {
      background-color: #0056b3;
    }

    .note {
      font-size: 16px;
      color: #555;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <a href="https://example.com" class="banner" title="Visit Example Website">
    Click Here to Visit Example.com
  </a>

  <div class="note">You will be redirected automatically...</div>

</body>
</html>
